<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>Add a Birthday</h2>
                <!-- TODO: Create a form for users to submit a name, a month, and a day -->
                <form action="/" method="POST">
                    <input type="hidden" name="FormName" value="Add">
                    <input type="text" name="Name" placeholder="Name" required>
                    <select name="Month" required>
                        <option disabled selected value="">Month</option>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>
                    <select name="Day" required>
                        <option disabled selected value="">Day</option>
                        <option>1st</option>
                        <option>2nd</option>
                        <option>3rd</option>
                        <option>4th</option>
                        <option>5th</option>
                        <option>6th</option>
                        <option>7th</option>
                        <option>8th</option>
                        <option>9th</option>
                        <option>10th</option>
                        <option>11th</option>
                        <option>12th</option>
                        <option>13th</option>
                        <option>14th</option>
                        <option>15th</option>
                        <option>16th</option>
                        <option>17th</option>
                        <option>18th</option>
                        <option>19th</option>
                        <option>20th</option>
                        <option>21st</option>
                        <option>22nd</option>
                        <option>23rd</option>
                        <option>24th</option>
                        <option>25th</option>
                        <option>26th</option>
                        <option>27th</option>
                        <option>28th</option>
                        <option>29th</option>
                        <option>30th</option>
                        <option>31st</option>
                    </select>
                    <button type="submit">Submit</button>
                </form>
            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- TODO: Loop through the database entries to display them in this table -->
                        {% for person in persons %}
                        <tr>
                            <td>{{ person.name }}</td>
                            <td>{{ person.month }}, {{ person.day }}</td>
                            <td>
                                <form action="/" method="POST">
                                    <input type="hidden" name="FormName" value="Del">
                                    <input type="hidden" value="{{ person.id }}" name="id">
                                    <button type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
