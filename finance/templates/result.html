{% extends "layout.html" %}

{% block title %}
    Result
{% endblock %}

{% block main %}
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: center;
      }
      th, td {
        border: 1px solid #ccc;
        padding: 8px 12px;
        max-width: 200px;
        word-wrap: break-word;
      }
      thead {
        background-color: #f5f5f5;
      }
      tr:hover {
        background-color: #f0f8ff; /* 鼠标悬停高亮 */
      }
    </style>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Symbol</th>
        </tr>
      </thead>
      <tbody name="result">
        <tr>
          <td>{{ result.name }}</td>
          <td>{{ result["price"] }}</td>
          <td>{{ result.symbol }}</td>
        </tr>
      </tbody>
    </table>
{% endblock %}
